name = "school-of-freelancing"
main = "src/index.js"
compatibility_date = "2026-09-20"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

