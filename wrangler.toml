name = "school-of-freelancing"
main = "src/index.js"
compatibility_date = "2026-09-20"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "404-page"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
