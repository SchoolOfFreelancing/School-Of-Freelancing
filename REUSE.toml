version = 1

[[annotations]]
path = [
  "**/*.html", "**/*.md", "**/*.json", "**/*.xml", "**/*.txt",
  "**/*.css", "**/*.svg", "**/*.png", "**/*.jpg", "**/*.webp", "**/*.ico",
  "**/*.yml", "**/*.yaml", "**/*.toml", "**/*.woff2", "**/*.webmanifest",
  ".assetsignore", ".gitignore", ".gitlab-ci.yml",
  "_headers", "_redirects",
  ".well-known/**", "oauth-authorization-server",
  "LICENSE", "REUSE.toml", "COPYRIGHT.md", "CITATION.cff", "c0326e255f0b4d45a96a9c7205d53fca.txt"
]
precedence = "aggregate"
