# -------------------------------------------------------
# Production GitLab CI/CD Pipeline
# Static HTML Website
# -------------------------------------------------------

# GitLab Lighthouse Component
include:
  - component: $CI_SERVER_FQDN/to-be-continuous/lighthouse/gitlab-ci-lighthouse@1.8.0
    inputs:
      review-enabled: true

stages:
  - validate
  - build
  - test
  - acceptance
  - security
  - deploy
  - release

variables:
  WEBSITE_URL: "https://www.schooloffreelancing.com"

cache:
  paths:
    - node_modules/

##########################################################
# HTML Validation
##########################################################

html-validate:
  stage: validate
  image: node:22
  before_script:
    - npm install -g html-validate
  script:
    - html-validate "**/*.html"

##########################################################
# CSS Validation
##########################################################

stylelint:
  stage: validate
  image: node:22
  before_script:
    - npm install -g stylelint stylelint-config-standard
  script:
    - stylelint "**/*.css" || true

##########################################################
# JavaScript Lint
##########################################################

eslint:
  stage: validate
  image: node:22
  before_script:
    - npm install -g eslint
  script:
    - |
      if find . -name "*.js" | grep -q .; then
        eslint .
      else
        echo "No JavaScript files found."
      fi

##########################################################
# Build
##########################################################

build:
  stage: build
  image: alpine:latest
  script:
    - mkdir public
    - cp -r * public/ || true
  artifacts:
    paths:
      - public

##########################################################
# Broken Link Checker
##########################################################

link-check:
  stage: test
  image: node:22
  before_script:
    - npm install -g broken-link-checker
  script:
    - blc "$WEBSITE_URL" -ro

##########################################################
# Security Headers
##########################################################

security-headers:
  stage: security
  image: curlimages/curl:latest
  script:
    - |
      curl -Is $WEBSITE_URL > headers.txt

      grep -i "Strict-Transport-Security" headers.txt
      grep -i "Content-Security-Policy" headers.txt || true
      grep -i "X-Frame-Options" headers.txt || true
      grep -i "Referrer-Policy" headers.txt || true
      grep -i "Permissions-Policy" headers.txt || true
      grep -i "X-Content-Type-Options" headers.txt || true

##########################################################
# Optional Lighthouse CLI
# (Use if component unavailable)
##########################################################

lighthouse-cli:
  stage: test
  image: node:22
  before_script:
    - npm install -g @lhci/cli
  script:
    - lhci autorun --collect.url=$WEBSITE_URL
  artifacts:
    when: always
    paths:
      - .lighthouseci/
  allow_failure: true

##########################################################
# GitLab Pages
##########################################################

pages:
  stage: deploy
  script:
    - echo "Deploying GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main

##########################################################
# Release
##########################################################

create-release:
  stage: release
  image: alpine:latest
  script:
    - echo "Creating Release"
  rules:
    - if: $CI_COMMIT_TAG
