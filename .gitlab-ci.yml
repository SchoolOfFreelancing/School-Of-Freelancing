# Add "release" to your global pipeline stages
stages:
  - build
  - test
  - deploy
  - release

create-release:
  stage: release
  script:
    - echo "Creating a new release..."

reuse_lint:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git && pip install -q "reuse[charset-normalizer]"
  script:
    - reuse lint
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
