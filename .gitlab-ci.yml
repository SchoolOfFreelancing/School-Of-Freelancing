##########################################################
# Release
##########################################################

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  rules:
    - if: '$CI_COMMIT_TAG'

  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "School of Freelancing $CI_COMMIT_TAG" \
        --notes "Release $CI_COMMIT_TAG of $CI_PROJECT_PATH"

  release:
    tag_name: $CI_COMMIT_TAG
    name: "School of Freelancing $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG of $CI_PROJECT_PATH"

    assets:
      links:
        - name: "Website"
          url: "https://www.schooloffreelancing.com"
