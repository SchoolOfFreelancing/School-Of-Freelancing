# Add "release" to your global pipeline stages
stages:
  - build
  - test
  - deploy
  - release

create-release:
  stage: release
  script:
    - echo "Creating a new release..."

reuse_lint:
  stage: test
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
