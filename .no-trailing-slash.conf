# School of Freelancing
# LOCAL APACHE VALIDATION ONLY
#
# Production is Cloudflare Worker / Pages.
# This file does NOT configure Cloudflare.
#
# Canonical policy:
#   NO TRAILING SLASH
#
# Example:
#   /about-us/ -> /about-us

RewriteEngine On

# Never redirect the homepage.
RewriteCond %{REQUEST_URI} !^/$

# Only process actual directories.
RewriteCond %{REQUEST_FILENAME} -d

# Only directories containing index.html.
RewriteCond %{REQUEST_FILENAME}/index.html -f

# Remove the trailing slash.
RewriteRule ^(.+)/$ /$1 [R=301,L,NE]
